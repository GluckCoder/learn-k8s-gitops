apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-deployment
spec:
  replicas: 2 # Kita minta Kubernetes menyalakan 2 buah aplikasi sekaligus untuk backup otomatis!
  selector:
    matchLabels:
      app: golang-app
  template:
    metadata:
      labels:
        app: golang-app
    spec:
      containers:
      - name: golang-container
        image: golang-pemula:v1 # Memakai image yang sudah kita load ke Kind tadi
        imagePullPolicy: Never # Memaksa K8s memakai image lokal, jangan cari ke internet
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: golang-service
spec:
  type: NodePort
  selector:
    app: golang-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080 # Kita kunci pintu masuk eksternal di port 30080
